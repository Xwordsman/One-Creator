name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: 类型检查、格式、单元测试与构建
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      # tests/nodes.test.ts starts a real executor and drives a real browser.
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build

  e2e:
    name: 浏览器端到端流程
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The preview server serves the built apps/web/dist, so build before testing.
      - run: npm run build
      - name: 运行浏览器端到端流程
        run: |
          set -o pipefail
          # The github reporter turns each failure into a public annotation with file, line and error.
          npx playwright test --reporter=github,line 2>&1 | tee e2e.log
      # Workflow logs need a signed-in account; the step summary is public and carries the failure text.
      - if: failure()
        name: 输出失败摘要
        run: |
          {
            echo '### 浏览器端到端流程失败'
            echo '```text'
            tail -n 200 e2e.log 2>/dev/null || echo '没有捕获到输出'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            e2e.log
          retention-days: 7
